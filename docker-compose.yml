
services:
  db:
    image: mariadb:10.11
    container_name: mariadb_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "1234"
      MARIADB_DATABASE: "clientes_supermercado_completa"
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  web:
    build: .
    container_name: flask_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SERVIDOR: db
      PUERTO: 3306
      USUARIO: root
      PASSWORD: "1234"
      BASE_DATOS: clientes_supermercado_completa
    depends_on:
      - db

volumes:
  mariadb_data:
