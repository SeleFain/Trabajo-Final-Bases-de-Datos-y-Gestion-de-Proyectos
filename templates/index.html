<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <!-- Vinculamos el archivo CSS de Flask -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="contenedor">
        <h1>Clientes Supermercado</h1>

        <!-- Formulario de Registro -->
        <div class="tarjeta">
            <h2>Registrar Nuevo Cliente</h2>
            <form id="formulario-cliente">
                <input type="text" id="nombre" placeholder="Nombre completo" required>
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="text" id="telefono" placeholder="Teléfono (Opcional)">
                <button type="submit">Guardar Cliente</button>
            </form>
        </div>

        <!-- Tabla de Resultados -->
        <div class="tarjeta">
            <h2>Lista de Clientes</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                    </tr>
                </thead>
                <tbody id="tabla-clientes">
                    <!-- JavaScript insertará las filas aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Vinculamos el archivo JavaScript de Flask -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
